services:
  lanparty:
    build: .
    image: ${IMAGE:-lanparty-manager:latest}
    container_name: ${CONTAINER_NAME:-lanparty}
    restart: unless-stopped
    ports:
      - "${PORT:-1337}:${PORT:-1337}"
    environment:
      PORT: ${PORT:-1337}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      BASE_URL: ${BASE_URL:-}
      DEFAULT_WATTS: ${DEFAULT_WATTS:-450}
      SECRET_KEY: ${SECRET_KEY:-}
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ${DATA_PATH:-./data}:/data
      # Lets the app start and stop game server containers. Remove to disable that module.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
