services:
  lanparty:
    build: .
    image: ${IMAGE:-lanparty-manager:latest}
    container_name: ${CONTAINER_NAME:-lanparty}
    restart: unless-stopped
    ports:
      - "${PORT:-1337}:${PORT:-1337}"
    environment:
      PORT: ${PORT:-1337}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      BASE_URL: ${BASE_URL:-}
      DEFAULT_WATTS: ${DEFAULT_WATTS:-450}
      SECRET_KEY: ${SECRET_KEY:-}
      TZ: ${TZ:-America/Chicago}
      SITE_NAME: ${SITE_NAME:-LAN Party}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Sign-in providers. Each one shows up on the sign-in page once its keys are set.
      STEAM_LOGIN: ${STEAM_LOGIN:-true}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_PRIVATE_KEY_FILE: ${APPLE_PRIVATE_KEY_FILE:-}
      # Email: sign-in links, receipts, gifted tickets.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      EMAIL_TO_LOG: ${EMAIL_TO_LOG:-}
      # Payments.
      CURRENCY: ${CURRENCY:-USD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
    volumes:
      - ${DATA_PATH:-./data}:/data
      # Lets the app start and stop game server containers. Remove to disable that module.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
