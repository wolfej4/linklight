<div class="panel seatpanel">
  <div class="ctop"><h2>{{ t.name }}, seat {{ n }}</h2><button class="linkbtn" onclick="this.closest('#seat-panel').innerHTML=''">Close</button></div>
  <form hx-post="/seating/seat/{{ t.id }}/{{ n }}" hx-target="#seatmap" hx-swap="outerHTML"
        hx-on::after-request="document.getElementById('seat-panel').innerHTML=''" class="inline-form">
    <select name="attendee_id" aria-label="Who sits here">
      <option value="0">{{ "Leave empty" if not occupant else "Clear this seat" }}</option>
      {% if occupant %}<option value="{{ occupant.id }}" selected>{{ occupant.name }} (here now)</option>{% endif %}
      {% if unseated %}<optgroup label="Needs a seat">{% for a in unseated %}<option value="{{ a.id }}">{{ a.name }}{% if a.handle %} ({{ a.handle }}){% endif %}, {{ a.watts }} W</option>{% endfor %}</optgroup>{% endif %}
      {% if seated %}<optgroup label="Move from another seat">{% for a in seated %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}</optgroup>{% endif %}
    </select>
    <button class="btn">Save seat</button>
  </form>
</div>
