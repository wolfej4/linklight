{% extends "base.html" %}
{% block mainclass %}narrow{% endblock %}
{% block content %}
<div class="pagehead"><h1>Edit {{ a.name }}</h1></div>
<form class="panel" method="post" action="/attendees/{{ a.id }}">
  <div class="row2">
    <label>Name<input name="name" value="{{ a.name }}" required></label>
    <label>Gamertag<input name="handle" value="{{ a.handle }}"></label>
  </div>
  <div class="row2">
    <label>Contact<input name="contact" value="{{ a.contact }}"></label>
    <label>Estimated watts<input name="watts" type="number" min="0" step="25" value="{{ a.watts }}"></label>
  </div>
  <label>Bringing<input name="gear" value="{{ a.gear }}"></label>
  <label>Notes<textarea name="notes" rows="3">{{ a.notes }}</textarea></label>
  <label class="check"><input type="checkbox" name="paid" value="1" {% if a.paid %}checked{% endif %}> Paid</label>
  <div class="inline">
    <button class="btn">Save changes</button>
    <a class="btn ghost" href="/attendees">Cancel</a>
  </div>
</form>
<form method="post" action="/attendees/{{ a.id }}/delete" data-confirm="Remove {{ a.name }}?">
  <button class="btn danger">Remove attendee</button>
</form>
{% endblock %}
