{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block mainclass %}narrow center{% endblock %}
{% block content %}
<form class="panel login" method="post" action="/login">
  <h1>Organizer sign in</h1>
  <input type="hidden" name="next" value="{{ next }}">
  <label>Password<input type="password" name="password" autofocus required autocomplete="current-password"></label>
  <button class="btn">Sign in</button>
</form>
{% endblock %}
